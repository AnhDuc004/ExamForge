        next_page_url:
          type: string
          nullable: true
        path:
          type: string
        per_page:
          type: integer
        prev_page_url:
          type: string
          nullable: true
        to:
          type: integer
          nullable: true
        total:
          type: integer

    UserResource:
      type: object
      required: [id, email, display_name, tenant_id, is_active, roles, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        tenant_id:
          type: string
          format: uuid
          nullable: true
        is_active:
          type: boolean
        roles:
          type: array
          items:
            type: object
            required: [id, name, description]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              description:
                type: string
