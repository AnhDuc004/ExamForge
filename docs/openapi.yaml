      responses:
        '202':
          description: Generation queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
        '400':
          $ref: '#/components/responses/BadRequestApiError'
        '401':
          $ref: '#/components/responses/UnauthorizedMessage'
        '403':
          $ref: '#/components/responses/ForbiddenMessage'
        '422':
          $ref: '#/components/responses/ValidationError'

  /ai/suggest-feedback:
    post:
      tags: [AI]
      summary: Suggest feedback
      description: Generate a feedback draft for an essay answer. Reviewer only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer_text]
              properties:
                answer_text:
                  type: string
                rubric:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Feedback suggestion generated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
        '400':
          $ref: '#/components/responses/BadRequestApiError'
        '401':
          $ref: '#/components/responses/UnauthorizedMessage'
        '403':
          $ref: '#/components/responses/ForbiddenMessage'
        '422':
          $ref: '#/components/responses/ValidationError'

  /health:
    get:
      tags: [System]
      summary: Health check
      description: Check database, Redis, and disk readiness. System Admin only.
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      responses:
        '200':
          description: Health check completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
        '401':
          $ref: '#/components/responses/UnauthorizedMessage'
        '403':
          $ref: '#/components/responses/ForbiddenMessage'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  parameters:
    XTenantID:
      name: X-Tenant-ID
      in: header
      description: |
        UUID của tenant hiện tại.
        Middleware sẽ ưu tiên resolve theo subdomain, sau đó mới đọc header này.
      required: false
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Số trang.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: Số bản ghi mỗi trang.
      schema:
        type: integer
        minimum: 1
        default: 15
    TenantFilter:
      name: tenant_id
      in: query
      description: Lọc theo tenant.
      schema:
        type: string
        format: uuid
    SearchQuery:
      name: search
      in: query
      description: Từ khóa tìm theo email hoặc tên hiển thị.
      schema:
        type: string
        maxLength: 255
    QuestionTypeQuery:
      name: type
      in: query
      description: Lọc câu hỏi theo loại câu hỏi.
      schema:
        type: string
        enum: [multiple_choice, short_answer, essay, true_false]
    QuestionStatusQuery:
      name: status
      in: query
      description: Lọc câu hỏi theo trạng thái.
      schema:
        type: string
        enum: [draft, published, archived]
    TagsQuery:
      name: tags
      in: query
      description: Danh sách tag. Có thể truyền lặp nhiều lần, ví dụ `tags=math&tags=algebra`.
      required: true
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    TenantIdPath:
      name: tenant
      in: path
      required: true
      description: ID của tenant.
      schema:
        type: string
        format: uuid
    UserIdPath:
      name: id
      in: path
      required: true
      description: ID của người dùng.
      schema:
        type: string
        format: uuid
    RoleIdPath:
      name: id
      in: path
      required: true
      description: ID của role.
      schema:
        type: string
        format: uuid
    PermissionIdPath:
      name: id
      in: path
      required: true
      description: ID của permission.
      schema:
        type: string
        format: uuid
    QuestionIdPath:
      name: id
      in: path
      required: true
      description: ID của câu hỏi.
      schema:
        type: string
        format: uuid
    AssignmentIdPath:
      name: id
      in: path
      required: true
      description: ID của assignment.
      schema:
        type: string
        format: uuid
    AssignmentStartIdPath:
      name: assignmentId
      in: path
      required: true
      description: ID of the assignment to start.
      schema:
        type: string
        format: uuid
    AttemptIdPath:
      name: id
      in: path
      required: true
      description: ID of the attempt.
      schema:
        type: string
        format: uuid
    AnswerIdPath:
      name: id
      in: path
      required: true
      description: ID of the answer.
      schema:
        type: string
        format: uuid
    JobIdPath:
      name: jobId
      in: path
      required: true
      description: ID of the export job.
      schema:
        type: string
        format: uuid
    TestIdPath:
      name: id
      in: path
      required: true
      description: ID của đề thi.
      schema:
        type: string
        format: uuid
    TestNestedIdPath:
      name: testId
      in: path
      required: true
      description: ID của đề thi trong các route lồng nhau.
      schema:
        type: string
        format: uuid
    SectionIdPath:
      name: sectionId
      in: path
      required: true
      description: ID của section.
      schema:
        type: string
        format: uuid
    SectionQuestionIdPath:
      name: sectionQuestionId
      in: path
      required: true
      description: ID của mapping câu hỏi trong section.
      schema:
        type: string
        format: uuid
    StatusPath:
      name: status
      in: path
      required: true
      description: Trạng thái câu hỏi.
      schema:
        type: string
        enum: [draft, published, archived]

  responses:
    UnauthorizedMessage:
      description: Chưa xác thực
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Unauthenticated
            error_code: UNAUTHENTICATED
            data: null
            errors: null
    ForbiddenMessage:
      description: Không có quyền truy cập
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Forbidden
            error_code: FORBIDDEN
            data: null
            errors: null
    TenantNotFoundMessage:
      description: Không tìm thấy tenant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Tenant not found
            error_code: TENANT_NOT_FOUND
            data: null
            errors: null
    NotFoundError:
      description: Không tìm thấy dữ liệu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: User not found
            errors: null
    BadRequestApiError:
      description: Lỗi nghiệp vụ hoặc dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Tenant not resolved
            error_code: null
            data: null
            errors: null
    ValidationError:
      description: Dữ liệu gửi lên không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            success: false
            message: The given data was invalid.
            data: null
            errors:
              email:
                - Email is already registered.

  schemas:
    SuccessEnvelope:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Thành công
        data:
          nullable: true
    ErrorEnvelope:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Có lỗi xảy ra
        error_code:
          type: string
          nullable: true
        errors:
          nullable: true
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
        data:
          nullable: true
    MessageOnlyResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Unauthorized
    ValidationErrorResponse:
      type: object
      required:
        - success
        - message
        - data
        - errors
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: The given data was invalid.
        data:
          nullable: true
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    AuthUserResource:
      type: object
      required: [id, email, display_name, tenant_id, is_active, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        tenant_id:
          type: string
          format: uuid
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    AuthTokenData:
      type: object
      required: [user, token, token_type]
      properties:
        user:
          $ref: '#/components/schemas/AuthUserResource'
        token:
          type: string
        token_type:
          type: string
          example: Bearer

    AuthPermissionItem:
      type: object
      required: [resource, action]
      properties:
        resource:
          type: string
          example: users
        action:
          type: string
          example: manage

    AuthMeData:
      type: object
      required: [user, permissions]
      properties:
        user:
          $ref: '#/components/schemas/AuthUserResource'
        tenant:
          allOf:
            - $ref: '#/components/schemas/TenantResource'
          nullable: true
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/AuthPermissionItem'

    TenantResource:
      type: object
      required: [id, name, slug, plan, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TenantPaginatorData:
