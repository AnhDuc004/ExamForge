      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        permissions:
          type: array
          items:
            type: object
            required: [id, resource, action]
            properties:
              id:
                type: string
                format: uuid
              resource:
                type: string
              action:
                type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RoleListData:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RoleResource'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    PermissionResource:
      type: object
