      properties:
        id:
          type: string
          format: uuid
        resource:
          type: string
        action:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PermissionListData:
      type: object
      required: [data, pagination]
      properties:
        data:
