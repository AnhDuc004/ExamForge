          format: uuid
        created_by:
          type: string
          format: uuid
        type:
          type: string
          enum: [multiple_choice, short_answer, essay, true_false]
        content:
          type: string
        options:
          type: array
          items:
            type: string
          nullable: true
        correct_answer:
          type: array
          items: {}
          nullable: true
        max_score:
          type: integer
        difficulty:
          type: string
          enum: [easy, medium, hard]
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [draft, published, archived]
        created_at:
