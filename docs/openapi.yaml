openapi: 3.0.3
info:
  title: ExamForge API
  version: 1.0.0
  description: |
    Tài liệu Swagger/OpenAPI cho toàn bộ API đã implement trong các module.

    Ghi chú:
    - API gốc được mount dưới `/api/v1`.
    - Các endpoint thuộc nhóm tenant-based sẽ ưu tiên resolve tenant qua subdomain, sau đó mới đọc header `X-Tenant-ID`.
    - Các lỗi `422` là lỗi validation chuẩn của Laravel.
    - Một số lỗi nghiệp vụ ở `QuestionService` đang được ném bằng `\Exception`; nếu chưa map ở global exception handler thì response thực tế có thể cần chuẩn hoá thêm.
servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Auth
    description: Xác thực và quản lý token đăng nhập
  - name: Tenants
    description: Quản lý tenant
  - name: Users
    description: Quản lý người dùng
  - name: Roles
    description: Quản lý vai trò
  - name: Permissions
    description: Quản lý quyền
  - name: Questions
    description: Quản lý câu hỏi
  - name: Assignments
    description: Quản lý phân công bài làm
  - name: Attempts
    description: Làm bài, lưu câu trả lời và nộp bài
  - name: Grading
    description: Manual review and final scoring
  - name: Reports
    description: Test result reporting
  - name: Tests
    description: Quản lý đề thi

security:
  - BearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập
      description: Xác thực email/mật khẩu và cấp token Sanctum. Có thể kèm tenant qua subdomain hoặc header `X-Tenant-ID`.
      security: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokenData'
              example:
                success: true
                message: Login successful
                data:
                  user:
                    id: 1
                    email: admin@example.com
                    display_name: Admin
                    tenant_id: null
                    is_active: true
                    created_at: '2026-06-16T09:00:00.000000Z'
                  token: 1|plain-text-token
                  token_type: Bearer
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/TenantNotFoundMessage'

  /auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản
      description: Tạo người dùng mới và cấp token đăng nhập ngay sau khi tạo. Có thể kèm tenant qua subdomain hoặc header `X-Tenant-ID`. Nếu có `invitation_token`, hệ thống sẽ đăng ký theo link mời và tự gán role `Student`.
      security: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokenData'
              example:
                success: true
                message: Registration successful
                data:
                  user:
                    id: 1
                    email: newuser@example.com
                    display_name: Người dùng mới
                    tenant_id: 1f2c3d4e-1111-2222-3333-444455556666
                    is_active: true
                    created_at: '2026-06-16T09:00:00.000000Z'
                  token: 1|plain-text-token
                  token_type: Bearer
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/TenantNotFoundMessage'

  /auth/student-invitations:
    post:
      tags: [Auth]
      summary: Tạo link mời student
      description: Teacher hoặc admin tạo link mời để student tự đăng ký. Invitation sẽ có hạn dùng và chỉ sử dụng một lần.
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentInvitationCreateRequest'
      responses:
        '201':
          description: Tạo invitation thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StudentInvitationData'
              example:
                success: true
                message: Student invitation created
                data:
                  invitation:
                    id: 1f2c3d4e-1111-2222-3333-444455556666
                    email: student@example.com
                    token: 8b3f1f2e0b5f4d63a5b5a8b8c7f9d1a2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8
                    invite_url: https://frontend.example.com/register?invite=8b3f1f2e0b5f4d63a5b5a8b8c7f9d1a2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8
                    expires_at: '2026-06-25T10:00:00.000000Z'
        '400':
          $ref: '#/components/responses/BadRequestApiError'
        '401':
          $ref: '#/components/responses/UnauthorizedMessage'
        '403':
          $ref: '#/components/responses/ForbiddenMessage'

  /auth/student-invitations/{token}:
    get:
      tags: [Auth]
      summary: Kiểm tra link mời student
      description: FE dùng endpoint này để verify invitation token trước khi hiển thị form đăng ký.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Invitation token nhận từ link mời.
      responses:
        '200':
          description: Invitation hợp lệ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StudentInvitationLookupData'
              example:
                success: true
                message: Invitation retrieved
                data:
                  invitation:
                    id: 1f2c3d4e-1111-2222-3333-444455556666
                    email: student@example.com
                    tenant_id: 0f1e2d3c-4444-5555-6666-777788889999
                    expires_at: '2026-06-25T10:00:00.000000Z'
                    used_at: null
                    is_expired: false
                    is_used: false
        '400':
          $ref: '#/components/responses/BadRequestApiError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất
      description: Thu hồi token hiện tại của người dùng đang đăng nhập.
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      responses:
        '200':
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        nullable: true
              example:
                success: true
                message: Logout successful
                data: null
        '401':
          $ref: '#/components/responses/UnauthorizedMessage'
        '404':
          $ref: '#/components/responses/TenantNotFoundMessage'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Làm mới token
      description: Hủy token hiện tại và cấp token mới.
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Làm mới token thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokenData'
              example:
                success: true
                message: Token refreshed
                data:
                  user:
                    id: 1
                    email: admin@example.com
                    display_name: Admin
                    tenant_id: null
                    is_active: true
                    created_at: '2026-06-16T09:00:00.000000Z'
                  token: 2|new-token
                  token_type: Bearer
        '401':
          $ref: '#/components/responses/UnauthorizedMessage'
        '404':
          $ref: '#/components/responses/TenantNotFoundMessage'

  /auth/revoke-all:
    post:
      tags: [Auth]
      summary: Thu hồi toàn bộ token
      description: Xoá tất cả token của người dùng hiện tại.
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      responses:
        '200':
          description: Thu hồi token thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        nullable: true
              example:
                success: true
                message: All tokens revoked
                data: null
        '401':
          $ref: '#/components/responses/UnauthorizedMessage'
        '404':
          $ref: '#/components/responses/TenantNotFoundMessage'

  /auth/me:
    get:
      tags: [Auth]
      summary: Lấy thông tin tài khoản hiện tại
      description: Trả về hồ sơ người dùng đang đăng nhập, tenant hiện tại và danh sách quyền đã tổng hợp.
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      responses:
        '200':
          description: Lấy thông tin thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthMeData'
              example:
                success: true
                message: User profile
                data:
                  user:
                    id: 1
                    email: admin@example.com
                    display_name: Admin
                    tenant_id: null
                    is_active: true
                    created_at: '2026-06-16T09:00:00.000000Z'
                  tenant:
                    id: 1f2c3d4e-1111-2222-3333-444455556666
                    name: Tenant Demo
                    slug: tenant-demo
                    plan: pro
                    is_active: true
                    created_at: '2026-06-16T09:00:00.000000Z'
                    updated_at: '2026-06-16T09:00:00.000000Z'
                  permissions:
                    - resource: users
                      action: manage
        '401':
          $ref: '#/components/responses/UnauthorizedMessage'
        '404':
          $ref: '#/components/responses/TenantNotFoundMessage'

  /tenants/:
    get:
      tags: [Tenants]
      summary: Danh sách tenant
      description: Lấy danh sách tenant có phân trang.
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Danh sách tenant
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantPaginatorData'
        '401':
          $ref: '#/components/responses/UnauthorizedMessage'
        '403':
          $ref: '#/components/responses/ForbiddenMessage'
        '404':
          $ref: '#/components/responses/NotFoundError'

    post:
      tags: [Tenants]
      summary: Tạo tenant
      description: Tạo tenant mới trong hệ thống.
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        '201':
          description: Tạo tenant thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantResource'
        '401':
          $ref: '#/components/responses/UnauthorizedMessage'
        '403':
          $ref: '#/components/responses/ForbiddenMessage'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /tenants/{tenant}:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
      - $ref: '#/components/parameters/XTenantID'
    get:
      tags: [Tenants]
      summary: Chi tiết tenant
      description: Lấy thông tin một tenant theo ID.
      responses:
        '200':
          description: Lấy tenant thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantResource'
        '401':
          $ref: '#/components/responses/UnauthorizedMessage'
        '403':
          $ref: '#/components/responses/ForbiddenMessage'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [Tenants]
      summary: Cập nhật tenant
      description: Cập nhật thông tin tenant theo ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateRequest'
      responses:
        '200':
          description: Cập nhật tenant thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantResource'
        '401':
          $ref: '#/components/responses/UnauthorizedMessage'
        '403':
          $ref: '#/components/responses/ForbiddenMessage'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Tenants]
      summary: Xoá tenant
      description: Xoá tenant theo ID.
      responses:
        '200':
          description: Xoá tenant thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        nullable: true
              example:
                success: true
                message: Tenant deleted
                data: null
        '401':
          $ref: '#/components/responses/UnauthorizedMessage'
        '403':
          $ref: '#/components/responses/ForbiddenMessage'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/:
    get:
      tags: [Users]
      summary: Danh sách người dùng
      description: Lấy danh sách người dùng theo tenant, có thể lọc thêm theo từ khóa tìm kiếm và phân trang.
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/TenantFilter'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Danh sách người dùng
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserListData'
        '401':
          $ref: '#/components/responses/UnauthorizedMessage'
        '403':
          $ref: '#/components/responses/ForbiddenMessage'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags: [Users]
      summary: Tạo người dùng
      description: Tạo người dùng mới và gán role nếu có.
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Tạo người dùng thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserResource'
        '401':
          $ref: '#/components/responses/UnauthorizedMessage'
        '403':
          $ref: '#/components/responses/ForbiddenMessage'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
      - $ref: '#/components/parameters/XTenantID'
    get:
      tags: [Users]
      summary: Chi tiết người dùng
      description: Lấy thông tin người dùng theo ID.
      responses:
        '200':
          description: Lấy người dùng thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserResource'
        '401':
          $ref: '#/components/responses/UnauthorizedMessage'
        '403':
          $ref: '#/components/responses/ForbiddenMessage'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [Users]
      summary: Cập nhật người dùng
      description: Cập nhật thông tin người dùng và role nếu có.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Cập nhật người dùng thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserResource'
        '401':
          $ref: '#/components/responses/UnauthorizedMessage'
        '403':
          $ref: '#/components/responses/ForbiddenMessage'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Users]
      summary: Xoá người dùng
      description: Xoá người dùng theo ID.
      responses:
        '200':
          description: Xoá người dùng thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        nullable: true
              example:
                success: true
                message: User deleted successfully
                data: null
        '401':
          $ref: '#/components/responses/UnauthorizedMessage'
        '403':
          $ref: '#/components/responses/ForbiddenMessage'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{id}/status:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
      - $ref: '#/components/parameters/XTenantID'
    put:
      tags: [Users]
      summary: Cập nhật trạng thái người dùng
      description: Bật hoặc tắt tài khoản người dùng.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Cập nhật trạng thái thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserResource'
        '401':
          $ref: '#/components/responses/UnauthorizedMessage'
        '403':
          $ref: '#/components/responses/ForbiddenMessage'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /roles/:
    get:
      tags: [Roles]
      summary: Danh sách vai trò
      description: Lấy danh sách role theo tenant và phân trang.
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/TenantFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Danh sách role
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RoleListData'
        '401':
          $ref: '#/components/responses/UnauthorizedMessage'
        '403':
          $ref: '#/components/responses/ForbiddenMessage'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags: [Roles]
      summary: Tạo vai trò
      description: Tạo role mới và gán permission nếu có.
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
      responses:
        '201':
          description: Tạo role thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RoleResource'
        '401':
          $ref: '#/components/responses/UnauthorizedMessage'
        '403':
          $ref: '#/components/responses/ForbiddenMessage'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /roles/{id}:
    parameters:
      - $ref: '#/components/parameters/RoleIdPath'
      - $ref: '#/components/parameters/XTenantID'
    get:
      tags: [Roles]
      summary: Chi tiết vai trò
      description: Lấy thông tin role theo ID.
      responses:
        '200':
          description: Lấy role thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RoleResource'
        '401':
          $ref: '#/components/responses/UnauthorizedMessage'
        '403':
          $ref: '#/components/responses/ForbiddenMessage'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [Roles]
      summary: Cập nhật vai trò
      description: Cập nhật role và danh sách permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdateRequest'
      responses:
        '200':
